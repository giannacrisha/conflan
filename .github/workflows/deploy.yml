# Refreshes agendas and publishes the web app plus data to GitHub Pages.
# One workflow on purpose: commits made by the default token don't trigger
# other workflows, so syncing and deploying have to happen in the same run.
name: Sync and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Sync agendas
        run: npm run sync
      - name: Commit agenda changes
        run: |
          if git diff --quiet -- public/data/; then
            echo "No agenda changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/
            git commit -m "Sync event data"
            git push
          fi
      - name: Export web app
        run: |
          npx expo export -p web
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
